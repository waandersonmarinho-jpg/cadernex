<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobre o Cadernex</title>
<meta name="description" content="A missão do Cadernex: dar ao entregador o valor inteiro do seu trabalho e ao comércio do bairro uma entrega justa e rastreável.">
<link rel="canonical" href="https://cadernex.com.br/sobre.html">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="/favicon-144.png" type="image/png" sizes="144x144">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#f7f5ef;--surface:#fff;--fg:#14161a;--muted:#5f646c;--line:#e4dfd2;--accent:#e0a800;--accent-soft:#f8ebc4;--good:#16865a}
@media (prefers-color-scheme:dark){:root{--bg:#0c0e11;--surface:#171a1f;--fg:#eaecef;--muted:#8b93a1;--line:#262a31;--accent:#f3ba2f;--accent-soft:#2e2610;--good:#2ebd85;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Barlow",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:28px 60px}
h1,h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.15;text-wrap:balance}
h1{font-size:36px;margin:0}
h2{font-size:24px;margin:34px 0 10px}
p,li{max-width:65ch}
a{color:var(--fg)}
.voltar{display:inline-block;margin-bottom:18px;font-weight:600}
.marca{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.marca img{width:84px;height:42px;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.lead{font-size:18px;margin:10px 0 0}
.selo{margin:18px 0 0;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent)}
.selo b{color:var(--fg)}
.passos{list-style:none;counter-reset:p;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.passos li{counter-increment:p;display:grid;grid-template-columns:32px 1fr;column-gap:12px;align-items:start}
.passos li::before{content:counter(p);width:30px;height:30px;border-radius:50%;background:var(--accent);color:#14161a;font:700 16px "Barlow Condensed",sans-serif;display:grid;place-items:center;grid-row:span 2}
.passos b{display:block}.passos span{color:var(--muted);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card b{font-family:"Barlow Condensed",sans-serif;font-size:20px}
.card p{margin:4px 0 0;color:var(--muted);font-size:15px}
.tab-w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;background:var(--surface);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.muted{color:var(--muted);font-size:14px}
.cta{display:inline-block;margin-top:26px;padding:14px 22px;border-radius:12px;background:var(--accent);color:#14161a;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
<a class="voltar" href="./">← Voltar ao Cadernex</a>
<div class="marca"><img src="marca.svg" alt="" width="84" height="42"><h1>Sobre o Cadernex</h1></div>
<h2>Nossa missão</h2>
<p class="lead">Dar ao entregador o valor inteiro do seu trabalho e ao comércio do bairro uma entrega justa e rastreável.</p>
<p>Criado pelo CEO da <b>@Cadernex Labs</b>.</p>

<h2>Suporte</h2>
<p><a href="mailto:suporte@cadernex.com.br">suporte@cadernex.com.br</a></p>

<a class="cta" href="./">Abrir o Cadernex</a>
</main>
</body>
</html>
